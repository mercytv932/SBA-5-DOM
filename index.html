<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
      }

      .container {
        background: #e7d2f8;
        width: 100%;
        max-width: 800px;
        padding: auto;
        display: flex;
        flex-direction: column;
        border-radius: 12px;
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.1);
      }

      .create-container {
        background-color: #ffffff;
        margin-bottom: 25px;
        padding: 21px 24px;
        border-radius: 10px;
      }

      .create-header {
        display: flex;
        flex-direction: column;
      }

      .create-header h1 {
        font-size: 33px;
        margin-bottom: auto;
        color: #333;
      }

      .create-header p {
        color: #64748b;
      }

      .title-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 12px;
      }

      .title-group label {
        font-weight: 600;
      }
      .title-group input {
        padding: 7px 20px;
        border-radius: 7px;
      }

      .content-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 12px;
      }
      .content-group label {
        font-weight: 600;
      }
      .content-group textarea {
        width: 100%;
        width: 700px;
        min-height: 100px;
        padding: 12px 16px;
        box-sizing: border-box;
        line-height: 1.5;
        font-size: 16px;
        color: #1f2937;
        border-radius: 7px;
      }

      .create-buttons {
        margin-bottom: 12px;
      }
      .addBtn {
        background-color: rgb(69, 69, 247);
        color: whitesmoke;
        border-radius: 5px;
        padding: 7px 17px;
        cursor: pointer;
        transition: 0.3s ease;
        font-size: 16px;
        margin-right: 12px;
      }
      .create-buttons .clearBtn {
        background-color: whitesmoke;
        color: rgb(49, 49, 49);
        border-radius: 5px;
        padding: 6px 20px;
        font-size: 14px;
        cursor: pointer;
        transition: 0.3s ease;
      }

      .post-container {
        background-color: #ffffff;
        margin-bottom: 20px;
        border-radius: 22px 24px;
        border-radius: 10px;
      }

      .post-header {
        display: flex;
        background-color: #2b8749;
        justify-content: space-between;
        align-self: center;
        margin-bottom: 18px;
      }

      .post-header h2 {
        color: #333;
        margin: 0;
        font-size: 1.5rem;
      }
      .showCount {
        background: #e0e7ff;
        color: #4338ca;
        padding: 10px 12px;
        border-radius: 999px;
        font-size: 0.9rem;
        font-weight: 600;
        margin: 2px;
      }

      .blogsDisplay {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .newBlog {
        background-color: #f8fafc;
        border: 1px solid #dbe3ee;
        border-radius: 10px;
        padding: 18px;
      }

      .newBlog h3 {
        margin: 0 0 6px;
        color: #1f2937;
        font-size: 1.25rem;
      }

      .newBlog p {
        margin: 8px 0;
        color: #475569;
        line-height: 1.6;
      }
    </style>
    <title>Blog</title>
  </head>
  <body>
    <main>
      <div class="container">
        <div class="create-container">
          <div class="create-header">
            <h1>Create New Post</h1>
            <p>Share your thoughts with the world</p>
          </div>

          <div class="title-group">
            <label for="post title">Post Title</label>
            <input
              type="title"
              id="titleInput"
              placeholder="Enter a title for your post..."
            />
          </div>

          <div class="content-group">
            <label for="text">Post Content</label>
            <textarea
              name=""
              id="contentText"
              placeholder="Write your post content here..."
            ></textarea>
          </div>

          <div class="create-buttons">
            <button class="addBtn">+ Add Post</button>
            <button class="clearBtn">🔄 Clear</button>
          </div>
        </div>

        <div class="post-container">
          <div class="post-header">
            <h2>Your Posts</h2>
            <span class="showCount">0 posts</span>
          </div>
          <div class="blogsDisplay"></div>
        </div>
      </div>
    </main>
    <script>
      const titleInput = document.querySelector("#titleInput");
      const contentText = document.querySelector("#contentText");
      const addBtn = document.querySelector(".addBtn");
      const clearBtn = document.querySelector(".clearBtn");
      const showCount = document.querySelector(".showCount");
      const blogsDisplay = document.querySelector(".blogsDisplay");

      let blogs = [];

      addBtn.addEventListener("click", () => {
        const title = titleInput.value.trim();
        const content = contentText.value.trim();
        const currentDate = new Date().toLocaleString([], {
          year: "numeric",
          month: "numeric",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });

        if (title === "" || content === "") {
          alert("Please fill all the fields!");
          return;
        }

        const newPost = {
          title: title,
          currentDate: currentDate,
          content: content,
        };
        blogs.push(newPost);

        saveToLocal();
        displayPosts();
        titleInput.value = "";
        contentText.value = "";
      });

      clearBtn.addEventListener("click", () => {
        titleInput.value = "";
        contentText.value = "";
      });

      function displayPosts() {
        showCount.textContent = `${blogs.length} ${blogs.length === 1 ? "post" : "posts"}`;
        blogsDisplay.innerHTML = "";

        blogs.forEach((post, index) => {
          const newBlog = document.createElement("div");
          newBlog.className = "newBlog";
          const blogTitle = document.createElement("h3");
          blogTitle.textContent = post.title;
          const blogDate = document.createElement("p");
          blogDate.textContent = post.currentDate;
          const blogP = document.createElement("p");
          blogP.textContent = post.content;
          const buttonsDiv = document.createElement("div");
          buttonsDiv.className = "buttonsDiv";
          const editBtn = document.createElement("button");
          editBtn.textContent = "Edit";
          editBtn.className = "editBtn";
          const deleteBtn = document.createElement("button");
          deleteBtn.textContent = "Delete";
          deleteBtn.className = "deleteBtn";

          let isEditing = false;
          editBtn.addEventListener("click", () => {
            if (!isEditing) {
              isEditing = true;
              editBtn.textContent = "Save";
              editBtn.classList.add("saveBtn");

              blogTitle.innerHTML = `<input type = "text" id="editTitle-${index}" value="${post.title}">`;
              blogP.innerHTML = `<textarea id="editContent-${index}"> ${post.content}</textarea>`;
            } else {
              const updatedTitle = document
                .getElementById(`editTitle-${index}`)
                .value.trim();
              const updatedContent = document
                .getElementById(`editContent-${index}`)
                .value.trim();

              if (updatedTitle === "" || updatedContent === "") {
                alert("Fields cannot be empty!");
                return;
              }

              blogs[index].title = updatedTitle;
              blogs[index].content = updatedContent;

              saveToLocal();
              displayPosts();
            }
          });

          deleteBtn.addEventListener("click", () => {
            blogs.splice(index, 1);
            saveToLocal();
            displayPosts();
          });

          buttonsDiv.appendChild(editBtn);
          buttonsDiv.appendChild(deleteBtn);
          newBlog.appendChild(blogTitle);
          newBlog.appendChild(blogDate);
          newBlog.appendChild(blogP);
          newBlog.appendChild(buttonsDiv);

          blogsDisplay.appendChild(newBlog);
        });
      }

      function saveToLocal() {
        localStorage.setItem("blogs", JSON.stringify(blogs));
      }

      function getFromLocal() {
        let savedBlogs = localStorage.getItem("blogs");
        if (savedBlogs) {
          return JSON.parse(savedBlogs);
        }
        return [];
      }

      blogs = getFromLocal();
      displayPosts();
    </script>
  </body>
</html>
