<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
      }

      .container {
        background: #e7d2f8;
        width: 100%;
        max-width: 800px;
        padding: 25px;
        display: flex;
        flex-direction: column;
        border-radius: 12px;
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.1);
      }

      .create-header {
        display: flex;
        flex-direction: column;
      }

      .create-header h1 {
        font-size: 33px;
        margin-bottom: auto;
      }

      .create-header p {
        color: #64748b;
      }

      .title-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 12px;
      }

      .title-group label {
        font-weight: 600;
      }
      .title-group input {
        padding: 7px 20px;
        border-radius: 7px;
      }

      .content-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 12px;
      }
      .content-group label {
        font-weight: 600;
      }
      .content-group textarea {
        width: 100%;
        width: 700px;
        min-height: 100px;
        padding: 12px 16px;
        box-sizing: border-box;
        line-height: 1.5;
        font-size: 16px;
        color: #1f2937;
        border-radius: 7px;
      }

      .create-buttons {
        margin-bottom: 12px;
      }
      .addBtn {
        background-color: rgb(69, 69, 247);
        color: whitesmoke;
        border-radius: 5px;
        padding: 7px 17px;
        cursor: pointer;
        transition: 0.3s ease;
        font-size: 16px;
        margin-right: 12px;
      }
      .create-buttons .clearBtn {
        background-color: whitesmoke;
        color: rgb(49, 49, 49);
        border-radius: 5px;
        padding: 6px 20px;
        font-size: 14px;
        cursor: pointer;
        transition: 0.3s ease;
      }
    </style>
    <title>Blog</title>
  </head>
  <body>
    <main>
      <div class="container">
        <div class="create-container">
          <div class="create-header">
            <h1>Create New Post</h1>
            <p>Share your thoughts with the world</p>
          </div>

          <div class="title-group">
            <label for="post title">Post Title</label>
            <input
              type="title"
              id="titleInput"
              placeholder="Enter a title for your post..."
            />
          </div>

          <div class="content-group">
            <label for="text">Post Content</label>
            <textarea
              name=""
              id="contentText"
              placeholder="Write your post content here..."
            ></textarea>
          </div>

          <div class="create-buttons">
            <button class="addBtn">+ Add Post</button>
            <button class="clearBtn">🔄 Clear</button>
          </div>
        </div>

        <div class="post-container">
          <div>
            <h2>Your Posts</h2>
            <span class="showCount">0 posts</span>
          </div>
          <div class="blogsDisplay"></div>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
