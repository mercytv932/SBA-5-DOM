<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .container {
        width: 100%;
        max-width: 800px;
        padding: 0;
        display: flex;
        flex-direction: column;
        border-radius: 12px;
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.1);
      }

      .create-container {
        background-color: #ffffff;
        margin-bottom: 25px;
        padding: 21px 24px;
        border-radius: 10px;
      }

      .create-header {
        display: flex;
        flex-direction: column;
      }

      .create-header h1 {
        font-size: 33px;
        margin-bottom: auto;
        color: #333;
      }

      .create-header p {
        color: #64748b;
      }

      .title-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 18px;
      }

      .title-group label {
        font-weight: 600;
      }
      .title-group input {
        padding: 7px 20px;
        border-radius: 7px;
        outline: none;
        transition: 0.2s ease;
        border: 1px solid #d1d5db;
      }

      .content-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 18px;
      }
      .content-group label {
        font-weight: 600;
      }
      .content-group textarea {
        width: 100%;
        min-width: 700px;
        min-height: 140px;
        padding: 12px 16px;
        box-sizing: border-box;
        line-height: 1.5;
        font-size: 16px;
        color: #1f2937;
        border-radius: 8px;
        outline: none;
        transition: 0.2s ease;
        border: 1px solid #d1d5db;
        resize: vertical;
      }

      .title-group input:focus,
      .content-group textarea:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
      }

      .title-group label,
      .content-group label {
        font-weight: 600;
        margin-bottom: 6px;
        color: #374151;
      }

      .create-buttons {
        display: flex;
        gap: 12px;
        margin-top: 12px;
      }
      .addBtn {
        background-color: rgb(69, 69, 247);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 12px 20px;
        cursor: pointer;
        transition: 0.3s ease;
        font-size: 16px;
        margin-right: 12px;
      }
      .addBtn:hover {
        background: #4338ca;
      }
      .create-buttons .clearBtn {
        background-color: whitesmoke;
        color: rgb(49, 49, 49);
        border-radius: 5px;
        padding: 6px 20px;
        font-size: 14px;
        cursor: pointer;
        transition: 0.3s ease;
      }

      .post-container {
        background-color: #ffffff;
      }

      .post-header {
        display: flex;
        background-color: #ffffff;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
      }

      .post-header h2 {
        color: #333;
        margin: 0;
        font-size: 1.5rem;
      }
      .showCount {
        background: #e0e7ff;
        color: #4338ca;
        padding: 10px 12px;
        border-radius: 999px;
        font-size: 0.9rem;
        font-weight: 600;
        margin: 2px;
      }

      .blogsDisplay {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .newBlog {
        background-color: #f8fafc;
        border: 1px solid #dbe3ee;
        border-radius: 10px;
        padding: 18px;
        margin: 5px 12px;
      }

      .newBlog h3 {
        margin: 0 0 6px;
        color: #1f2937;
        font-size: 1.25rem;
      }

      .newBlog p {
        margin: 8px 0;
        color: #475569;
        line-height: 1.6;
      }

      .newBlog p:nth-of-type(1) {
        color: #94a3b8;
        font-size: 0.85rem;
      }

      .buttonsDiv {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }

      .editBtn,
      .deleteBtn {
        padding: 7px 16px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }

      .editBtn {
        background-color: #eff6ff;
        color: #2563eb;
        border: 1px solid #93cf5d;
      }

      .deleteBtn {
        background-color: #fef2f2;
        color: #dc2626;
        border: 1px solid #fca5a5;
      }

      .editBtn:hover {
        background-color: #deeafe;
      }

      .deleteBtn:hover {
        background-color: #fee2e2;
      }

      .saveBtn {
        background-color: #dcdce7;
        color: #15803d;
        border: 1px solid #86efac;
      }

      .newBlog input,
      .newBlog textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font: inherit;
      }

      .newBlog textarea {
        min-height: 90px;
        resize: vertical;
      }
    </style>
    <title>Blog</title>
  </head>
  <body>
    <main>
      <div class="container">
        <div class="create-container">
          <div class="create-header">
            <h1>Create New Post</h1>
            <p>Share your thoughts with the world</p>
          </div>

          <div class="title-group">
            <label for="post title">Post Title</label>
            <input
              type="title"
              id="titleInput"
              placeholder="Enter a title for your post..."
            />
          </div>

          <div class="content-group">
            <label for="text">Post Content</label>
            <textarea
              name=""
              id="contentText"
              placeholder="Write your post content here..."
            ></textarea>
          </div>

          <div class="create-buttons">
            <button class="addBtn">+ Add Post</button>
            <button class="clearBtn">🔄 Clear</button>
          </div>
        </div>

        <div class="post-container">
          <div class="post-header">
            <h2>Your Posts</h2>
            <span class="showCount">0 posts</span>
          </div>
          <div class="blogsDisplay"></div>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
